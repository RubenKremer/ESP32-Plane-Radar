# Build release firmware for a tag and attach it to its GitHub Release.
#
# Runs when a release is published (e.g. the auto-draft from build.yml) or a
# v* tag is pushed. The firmware is rebuilt at the tag so it reports exactly
# that version, replacing any preview files the draft carried. Idempotent:
# if publishing also fires the tag push, the second run re-uploads the same
# files.
name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach firmware to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build firmware
        uses: ./.github/actions/build-firmware
        with:
          version: ${{ env.TAG }}

      - name: Attach firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Tag pushed by hand: create the release for it, with generated
            # notes plus credits for ported work since the previous tag.
            # (A published draft already has both.)
            previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            notes_args=(-f tag_name="$TAG")
            if [[ -n "$previous" ]]; then
              notes_args+=(-f previous_tag_name="$previous")
              credits="$(bash .github/scripts/release-credits.sh "$previous..$TAG")"
            else
              credits="$(bash .github/scripts/release-credits.sh "$TAG")"
            fi
            {
              gh api "repos/$REPO/releases/generate-notes" "${notes_args[@]}" --jq .body
              if [[ -n "$credits" ]]; then
                echo
                echo "$credits"
              fi
            } > notes.md
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
