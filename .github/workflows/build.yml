# Build firmware on every push and PR. Each push to main also refreshes a
# draft GitHub Release with the new firmware, ready to review and publish.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Proposed tag for the first draft, when the repo has no releases yet.
  INITIAL_VERSION: v1.2.0

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for git describe

      - name: Build firmware
        uses: ./.github/actions/build-firmware

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-supermini
          if-no-files-found: error
          path: dist/*

  draft-release:
    needs: firmware
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-draft
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history + tags, for the credits section

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: plane-radar-supermini
          path: dist

      - name: Refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- plane-radar-auto-draft -->'

          # Propose the next patch version after the latest published release.
          latest="$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "$latest" ]]; then
            next="$INITIAL_VERSION"
          elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            next="${latest}-next"
          fi
          echo "Latest release: ${latest:-none}; proposing $next"

          notes_args=(-f tag_name="$next" -f target_commitish="$GITHUB_SHA")
          if [[ -n "$latest" ]]; then
            notes_args+=(-f previous_tag_name="$latest")
          fi
          generated="$(gh api "repos/$REPO/releases/generate-notes" "${notes_args[@]}" --jq .body)"

          # Original authors of ported work (Ported-from: commit trailers).
          if [[ -n "$latest" ]]; then
            credits="$(bash .github/scripts/release-credits.sh "$latest..$GITHUB_SHA")"
          else
            credits="$(bash .github/scripts/release-credits.sh "$GITHUB_SHA")"
          fi

          {
            echo "$marker"
            echo "> **Auto-generated draft** from \`${GITHUB_SHA::7}\`, refreshed on every push to \`main\`."
            echo "> Edit the tag (and these notes) if needed, then **Publish**. Publishing creates the tag,"
            echo "> and the Release workflow rebuilds the firmware so it reports exactly that version."
            echo
            echo "**Files:** \`plane-radar-full.bin\`: first install over USB, flash at \`0x0\` (erases settings)."
            echo "\`plane-radar-ota.bin\`: update through the portal's **Update** page (keeps settings)."
            echo
            echo "$generated"
            if [[ -n "$credits" ]]; then
              echo
              echo "$credits"
            fi
          } > notes.md

          # Replace the previous auto-draft (only ones this workflow made).
          gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft and ((.body // \"\") | contains(\"$marker\"))) | .id" |
          while read -r id; do
            echo "Deleting previous draft $id"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done

          gh release create "$next" dist/* --repo "$REPO" --draft \
            --target "$GITHUB_SHA" --title "$next" --notes-file notes.md
